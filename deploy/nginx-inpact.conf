# nginx site, HTTP only: public port 80 -> gunicorn on 127.0.0.1:8000
# Used by setup_server.sh on a fresh server, before a certificate exists.
# deploy/enable_https.sh then gets the certificate and replaces this file with
# deploy/nginx-inpact-https.conf (HTTPS, with port 80 redirecting to it).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name inpact-epa.ie www.inpact-epa.ie _;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
