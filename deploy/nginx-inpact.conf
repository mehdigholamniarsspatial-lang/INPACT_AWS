# nginx site, HTTP only: public port 80 -> gunicorn on 127.0.0.1:8000
# Used by setup_server.sh on a fresh server, before a certificate exists.
# deploy/enable_https.sh then gets the certificate and replaces this file with
# deploy/nginx-inpact-https.conf (HTTPS, with port 80 redirecting to it).
limit_req_zone $binary_remote_addr zone=inpact_feedback:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name inpact-epa.ie www.inpact-epa.ie _;
    server_tokens off;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # The client's real address: overwrite whatever the client sent in these headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location ^~ /api/feedback/ {
        limit_req zone=inpact_feedback burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
