# nginx site with HTTPS: port 443 -> gunicorn on 127.0.0.1:8000, port 80 -> redirect to HTTPS.
# Installed by deploy/enable_https.sh once the Let's Encrypt certificate exists
# (/etc/letsencrypt/live/inpact-epa.ie/). Certbot renews the certificate on its own.
# HSTS, X-Frame-Options, nosniff and Referrer-Policy come from Django (settings.py).

# Feedback API (key checks, submissions, downloads): per client address, shared by all
# gunicorn workers. Generous enough for a group answering from one office network.
limit_req_zone $binary_remote_addr zone=inpact_feedback:10m rate=30r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name inpact-epa.ie www.inpact-epa.ie;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/inpact-epa.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inpact-epa.ie/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # The client's real address: overwrite whatever the client sent in these headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Survey privacy: no access log for the feedback API, so no IP address is ever written
    # next to a survey request. Rate-limit rejections are logged at "warn", below the
    # "crit" level kept for this location, so they do not write client addresses either.
    # (The rate limiter holds addresses in memory only, for about a minute.)
    location ^~ /api/feedback/ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        limit_req zone=inpact_feedback burst=30 nodelay;
        limit_req_log_level warn;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# Port 80: send everything (domain, www and the bare IP) to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name inpact-epa.ie www.inpact-epa.ie _;
    server_tokens off;

    if ($host = www.inpact-epa.ie) {
        return 301 https://www.inpact-epa.ie$request_uri;
    }
    return 301 https://inpact-epa.ie$request_uri;
}
