# nginx site with HTTPS: port 443 -> gunicorn on 127.0.0.1:8000, port 80 -> redirect to HTTPS.
# Installed by deploy/enable_https.sh once the Let's Encrypt certificate exists
# (/etc/letsencrypt/live/inpact-epa.ie/). Certbot renews the certificate on its own.
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name inpact-epa.ie www.inpact-epa.ie;

    ssl_certificate /etc/letsencrypt/live/inpact-epa.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inpact-epa.ie/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Port 80: send everything (domain, www and the bare IP) to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name inpact-epa.ie www.inpact-epa.ie _;

    if ($host = www.inpact-epa.ie) {
        return 301 https://www.inpact-epa.ie$request_uri;
    }
    return 301 https://inpact-epa.ie$request_uri;
}
